name: Supabase Keep-Alive (Multi)

on:
  schedule:
    - cron: '0 8 */3 * *'  # elke 3 dagen om 08:00 UTC
  workflow_dispatch:         # ook handmatig uitvoerbaar via GitHub Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping multi database (kqlpttcqepzyhzdkndxa)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/wijnen?limit=1")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Ping mislukt met status $STATUS"
            exit 1
          fi
          echo "Supabase multi wakker en bereikbaar ✓"
